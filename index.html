<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dead End (1977)</title>

<script src="https://player.vimeo.com/api/player.js"></script>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #0b0b0b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #fff;
  }

  .container {
    max-width: 960px;
    margin: auto;
    padding: 20px;
  }

  .title {
    text-align: center;
    margin-bottom: 16px;
  }

  .title h1 {
    font-size: 22px;
    font-weight: 500;
    margin: 0;
    opacity: 0.9;
  }

  .player-wrapper {
    position: relative;
    aspect-ratio: 16 / 9;
    background: black;
    overflow: hidden;
    border-radius: 12px;
  }

  iframe {
    width: 100%;
    height: 100%;
  }

  .subtitle {
    position: absolute;
    bottom: 8%;
    width: 100%;
    text-align: center;
    padding: 0 12px;
    font-size: clamp(14px, 2.6vw, 20px);
    line-height: 1.4;
    color: #fff;
    text-shadow:
      0 0 6px rgba(0,0,0,.9),
      0 2px 8px rgba(0,0,0,.9);
    pointer-events: none;
    transition: opacity .15s ease;
  }

  .footer {
    text-align: center;
    margin-top: 14px;
    font-size: 12px;
    opacity: 0.4;
  }
</style>
</head>

<body>
  <div class="container">
    <div class="title">
      <h1>Dead End (1977)</h1>
    </div>

    <div class="player-wrapper">
      <iframe
        id="vimeoPlayer"
        src="https://player.vimeo.com/video/361791916"
        frameborder="0"
        allow="autoplay; fullscreen"
        allowfullscreen>
      </iframe>

      <div id="subtitle" class="subtitle"></div>
    </div>

    <div class="footer">
      External subtitles • synced locally
    </div>
  </div>

<script>
  const subtitleBox = document.getElementById("subtitle");
  const player = new Vimeo.Player("vimeoPlayer");

  let subtitles = [];

  fetch("subs.json")
    .then(res => res.json())
    .then(data => subtitles = data);

  player.on("timeupdate", ({ seconds }) => {
    const current = subtitles.find(
      s => seconds >= s.start && seconds <= s.end
    );

    subtitleBox.innerText = current ? current.text : "";
    subtitleBox.style.opacity = current ? 1 : 0;
  });
</script>
</body>
</html>
